[workspace]
resolver = "2"
members = [
    "bindgen",
    "samples/*",
    "winui3",
]
default-members = [
    "winui3",
]

[workspace.dependencies]
toml_edit = "0.25"
windows = "0.62"
windows-bindgen = "0.63"
windows-collections = "0.3"
windows-core = "0.62"
windows-future = "0.3"
windows-link = "0.2"
windows-numerics = "0.3"
winui3 = { path = "winui3" }
